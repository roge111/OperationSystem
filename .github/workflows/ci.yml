name: CI Tests


on:
  push:                    # Запускать при push в любую ветку
    branches: [ main, master ]
  pull_request:            # И при открытии Pull Request
    branches: [ main, master ]


jobs:
  build-and-test:
    runs-on: ubuntu-latest  # ОС для запуска (можно поменять)


    steps:
      # 1. Клонировать репозиторий
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Установить зависимости (если нужны)
      - name: Install Python
        run: sudo apt-get update && sudo apt-get install -y python3 python3-pip


      # 3. Собрать shell (если его нет в репозитории)
      - name: Build shell
        run: bash build.sh


      # 4. Запустить тесты
      - name: Run tests
        run: python3 БЛР1/testing_shell.py

      # 5. Очистить после тестов (опционально)
      - name: Clean up
        run: rm -f shell
